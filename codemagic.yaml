# Construction iOS dans le nuage (Codemagic) et envoi à TestFlight.
# Aucun secret dans ce fichier : la clé API App Store Connect et l'identifiant de
# l'app sont configurés dans l'interface de Codemagic (voir docs/ios_testflight.md).
workflows:
  ios-testflight:
    name: Chantier+ iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Nom donné à la clé API dans Codemagic : Teams > Integrations > App Store Connect.
      app_store_connect: Chantier+
    environment:
      groups:
        - signature   # contient CERTIFICATE_PRIVATE_KEY (variable secrète)
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # Identifiant numérique de l'app dans App Store Connect (Informations sur l'app > ID Apple).
        APP_STORE_APPLE_ID: "6817907454"
        BUNDLE_ID: "app.chantierplus"
        # CERTIFICATE_PRIVATE_KEY : variable SECURE du groupe « signature » saisie dans Codemagic (jamais ici).
    scripts:
      - name: Dépendances
        script: flutter pub get
      - name: Analyse et tests
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Signature du code
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilation de l'IPA
        script: |
          #!/usr/bin/env bash
          set -o pipefail
          BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          # Xcode télécharge les dépendances Firebase (Swift Package Manager) chez
          # Google ; un délai dépassé est passager. On ne recommence que dans ce
          # cas : une vraie erreur de compilation arrête le build tout de suite.
          for tentative in 1 2 3; do
            if flutter build ipa --release --build-number="$BUILD" \
              --export-options-plist=/Users/builder/export_options.plist 2>&1 | tee build_ipa.log; then
              exit 0
            fi
            if ! grep -qiE "resolve (swift package manager|package) dependencies" build_ipa.log \
              || [ "$tentative" -eq 3 ]; then
              exit 1
            fi
            echo "Téléchargement des dépendances Swift échoué (essai $tentative sur 3) : nouvel essai dans 30 s."
            sleep 30
          done
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
